# ===================================================================
# BarberApp Backend Configuration
# ===================================================================

# Conexão Banco de Dados PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/barberapp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres }
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configurações de Expediente e Geração de Slots (Seção 4)
horario.abertura=09:00
horario.fechamento=19:00
slot.duracao.minutos=30
dias.atendimento=SEG,TER,QUA,QUI,SEX,SAB

# Credenciais de Administrador para HTTP Basic Auth (Seção 8)
admin.user=admin
admin.pass=admin123
