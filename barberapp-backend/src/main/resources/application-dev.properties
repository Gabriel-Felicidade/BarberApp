# ===================================================================
# BarberApp Backend Configuration - DEV PROFILE
# ===================================================================

# Conexão Banco de Dados H2
spring.datasource.url=jdbc:h2:mem:barberapp_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (opcional, útil para debugar o dev profile)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configurações de Expediente e Geração de Slots (Seção 4)
horario.abertura=09:00
horario.fechamento=19:00
slot.duracao.minutos=30
dias.atendimento=SEG,TER,QUA,QUI,SEX,SAB

# Credenciais de Administrador para HTTP Basic Auth (Seção 8)
admin.user=admin
admin.pass=admin123
