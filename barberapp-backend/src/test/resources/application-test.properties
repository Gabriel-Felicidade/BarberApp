# H2 Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

horario.abertura=09:00
horario.fechamento=19:00
slot.duracao.minutos=30
dias.atendimento=SEG,TER,QUA,QUI,SEX,SAB

admin.user=admin
admin.pass=admin123
